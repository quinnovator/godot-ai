name: Godot AI checks

on:
  push:
    branches: [ai-native]
    paths:
      - ".github/workflows/godot_ai.yml"
      - "agent/**"
      - "core/**"
      - "doc/**"
      - "drivers/**"
      - "editor/**"
      - "main/**"
      - "runtime/**"
      - "modules/godot_agent/**"
      - "modules/godot_ai_model/**"
      - "platform/**"
      - "scene/**"
      - "examples/agent_smoke/**"
      - "examples/blender_asset/**"
      - "games/pixiball/**"
      - "tools/godot-ai/**"
      - "tests/drivers/**"
      - "tests/editor/**"
      - "SConstruct"
      - "version.py"
  pull_request:
    paths:
      - ".github/workflows/godot_ai.yml"
      - "agent/**"
      - "core/**"
      - "doc/**"
      - "drivers/**"
      - "editor/**"
      - "main/**"
      - "runtime/**"
      - "modules/godot_agent/**"
      - "modules/godot_ai_model/**"
      - "platform/**"
      - "scene/**"
      - "examples/agent_smoke/**"
      - "examples/blender_asset/**"
      - "games/pixiball/**"
      - "tools/godot-ai/**"
      - "tests/drivers/**"
      - "tests/editor/**"
      - "SConstruct"
      - "version.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sidecar-and-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      - name: Install sidecar
        run: python -m pip install -e agent mypy==1.19.1 ruff==0.15.21

      - name: Build licensed sidecar distributions
        run: |
          python -m pip install build==1.3.0
          python -m build agent
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          dist = Path("agent/dist")
          wheel = next(dist.glob("*.whl"))
          sdist = next(dist.glob("*.tar.gz"))
          with zipfile.ZipFile(wheel) as archive:
              assert any(name.endswith(".dist-info/licenses/LICENSE.txt") for name in archive.namelist())
          with tarfile.open(sdist) as archive:
              assert any(name.endswith("/LICENSE.txt") for name in archive.getnames())
          PY

      - name: Run sidecar tests
        run: python -m unittest discover -s agent/tests -v

      - name: Lint and type-check sidecar
        run: |
          ruff check agent tools/godot-ai/*.py examples/blender_asset/build_beacon.py games/pixiball/assets/blender/*.py games/pixiball/tools/blender/build_candidate.py modules/godot_agent/config.py
          mypy agent/godot_agent

      - name: Check source recipes and vendored runtime add-on
        run: |
          python -m py_compile examples/blender_asset/build_beacon.py games/pixiball/assets/blender/*.py games/pixiball/tools/blender/build_candidate.py
          tools/godot-ai/sync-runtime-addon.sh --check

  engine-module:
    name: Compile editor module (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python and pinned SCons
        uses: ./.github/actions/godot-deps
        with:
          scons-version: 4.10.1

      - name: Install headless Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libfontconfig1-dev

      - name: Restore build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: godot-ai-linux-editor
        continue-on-error: true

      - name: Compile AI-enabled editor
        uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: >-
            -j2
            dev_build=yes
            strict_checks=yes
            debug_symbols=no
            accesskit=no
            x11=no
            wayland=no
            alsa=no
            pulseaudio=no
            dbus=no
            speechd=no
            fontconfig=yes
            udev=no
            module_godot_agent_enabled=yes
            tests=yes

      - name: Test AI-native engine extensions
        shell: bash
        run: |
          set -euo pipefail
          godot="$GITHUB_WORKSPACE/bin/godot.linuxbsd.editor.dev.x86_64"
          (
            cd "$RUNNER_TEMP"
            "$godot" --test --test-case='[AITreeModel]*'
            "$godot" --test --test-case='[SDL][DualSense]*'
            "$godot" --test --test-case='[Editor] External changes only auto-reload when safe'
          )

      - name: Exercise fresh headless authoring and runtime loops
        shell: bash
        run: |
          set -euo pipefail
          project="$RUNNER_TEMP/godot-ai-smoke"
          log="$RUNNER_TEMP/godot-ai-editor.log"
          cp -R examples/agent_smoke "$project"
          rm -rf "$project/.godot" "$project/main.tscn"
          sed -i '/run\/main_scene=/d' "$project/project.godot"

          bin/godot.linuxbsd.editor.dev.x86_64 --headless --editor --path "$project" >"$log" 2>&1 &
          editor_pid=$!
          cleanup() {
            pkill -TERM -P "$editor_pid" 2>/dev/null || true
            kill "$editor_pid" 2>/dev/null || true
            wait "$editor_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _attempt in $(seq 1 200); do
            if [ -s "$project/.godot/agent/endpoint.json" ]; then
              break
            fi
            if ! kill -0 "$editor_pid" 2>/dev/null; then
              cat "$log"
              exit 1
            fi
            sleep 0.1
          done
          test -s "$project/.godot/agent/endpoint.json"
          test "$(stat -c '%a' "$project/.godot/agent")" = 700
          test "$(stat -c '%a' "$project/.godot/agent/endpoint.json")" = 600

          python tools/godot-ai/smoke_scene.py --project "$project" --allow-missing-capture
          python tools/godot-ai/smoke_scene.py --project "$project" --allow-missing-capture
          python tools/godot-ai/runtime_smoke.py --project "$project" --allow-missing-capture

          cleanup
          trap - EXIT
          cat "$log"
          if grep -q 'ERROR:' "$log"; then
            exit 1
          fi

      - name: Test semantic gameplay driver contract
        run: >-
          bin/godot.linuxbsd.editor.dev.x86_64 --headless
          --path examples/agent_smoke
          --script res://runtime_gameplay_test.gd

      - name: Test Pixiball benchmark game
        shell: bash
        run: |
          set -euo pipefail
          godot="$GITHUB_WORKSPACE/bin/godot.linuxbsd.editor.dev.x86_64"
          GODOT_BIN="$godot" tools/godot-ai/test-pixiball.sh
          pack="$RUNNER_TEMP/pixiball-export-smoke.pck"
          "$godot" --headless --path "$GITHUB_WORKSPACE/games/pixiball" \
            --export-pack macOS "$pack"
          test -s "$pack"

      - name: Save build cache
        if: always()
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: godot-ai-linux-editor
        continue-on-error: true
