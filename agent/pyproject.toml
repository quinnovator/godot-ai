[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "godot-agent"
version = "0.1.0"
description = "Standard-library JSON-RPC client for the AI-enabled Godot editor"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE.txt"]
dependencies = []

[project.scripts]
godot-agent = "godot_agent.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["godot_agent*"]
exclude = ["tests*"]
